name: 프로젝트 자동 검사

on:
  push:
    branches:
      - chore/ci-cd
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 테스트 및 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 프론트 패키지 설치
        run: npm ci

      - name: 서버 패키지 설치
        run: npm ci --prefix server

      - name: 코드 검사
        run: npm run lint

      - name: API 테스트
        run: npm run test:api

      - name: 프론트 빌드
        run: npm run build
